<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CLVA - Course Leader Virtual Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="chat">
    <header class="chat-header">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3zm-7 9.7V17c0 1.7 3.1 3 7 3s7-1.3 7-3v-4.3l-7 3.8-7-3.8z"/>
      </svg>
      <div class="title">
        <h1>CLVA</h1>
        <p>Course Leader Virtual Assistant</p>
      </div>
      <label class="mode">
        Pipeline
        <select id="mode">
          <option value="enhanced">Enhanced</option>
          <option value="baseline">Baseline</option>
        </select>
      </label>
    </header>

    <section id="messages" class="messages" aria-live="polite"></section>

    <div id="suggestions" class="suggestions">
      <button type="button">When is my assignment due?</button>
      <button type="button">How do I get an extension?</button>
      <button type="button">What modules do I study?</button>
      <button type="button">Tell me about 5CS045</button>
    </div>

    <form id="ask-form" class="composer" autocomplete="off">
      <input id="query" type="text" maxlength="500" placeholder="Type your question here..." aria-label="Your question" required>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
  <script src="/static/chat.js"></script>
</body>
</html>
